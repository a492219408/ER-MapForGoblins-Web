server {
    listen 8080;
    server_name _;

    location ~ ^/assets/.*\.v[0-9]+\.json$ {
        root /srv;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /assets/ {
        alias /srv/assets/;
        autoindex off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 204;
    }
}
