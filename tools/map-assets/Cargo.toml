[package]
name = "mfg-map-codec"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0"
ddsfile = "0.5"
image = { version = "0.25", default-features = false, features = ["webp"] }
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
